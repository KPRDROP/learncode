name: US Open Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple US Open updater runs from running simultaneously.
concurrency:
  group: usop-updater
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"

      - name: Run US Open updater
        env:
          USOP_API_URL: ${{ secrets.USOP_API_URL }}
          OUTPUT_DIR: .
        run: |
          python -c "import asyncio; from usop import main; asyncio.run(main())"

      - name: Commit and push changes
        if: success()
        run: |
          set -e

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add usop_vlc.m3u8 usop_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update US Open playlists [skip ci]"

          # Get the newest version of main before pushing.
          git fetch origin main

          # Reapply our commit on top of the newest remote main.
          git rebase origin/main

          # Push the rebased commit.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Remote main changed. Fetching and rebasing again..."

              git fetch origin main
              git rebase origin/main
            fi
          done

          echo "ERROR: Failed to push after 3 attempts."
          exit 1
