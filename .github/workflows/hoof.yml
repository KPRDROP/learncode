name: Hoofoot Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright aiohttp "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"
        playwright install chromium
        playwright install-deps
    
    - name: Run hoofoot scraper
      run: |
        python hoof.py
    
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add hoof_vlc.m3u8 hoof_tivimate.m3u8 cache_hoof.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Update hoofoot streams $(date '+%Y-%m-%d %H:%M:%S')"
        git push origin HEAD:main
