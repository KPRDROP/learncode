name: OZOG Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp selectolax
        pip install playwright "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"
    
    - name: Run OZOG updater
      env:
        OUTPUT_DIR: .
      run: |
        python -c "import asyncio; from ozog import main; asyncio.run(main())"
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add ozog_vlc.m3u8 ozog_tivimate.m3u8
        git diff --staged --quiet || git commit -m "Update OZOG playlists [skip ci]"
        git push
