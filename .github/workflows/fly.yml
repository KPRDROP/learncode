name: Generate FLY M3U8 Files

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp selectolax
          pip install playwright httpx[http2] pytz
          
      - name: Run FLY scraper
        env:
          FLY_API_URL: ${{ secrets.FLY_API_URL }}
          FLY_BASE_URL: ${{ secrets.FLY_BASE_URL }}
          VLC_USER_AGENT: ${{ secrets.VLC_USER_AGENT }}
          TIVIMATE_USER_AGENT: ${{ secrets.TIVIMATE_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the main script
          python -c "import asyncio; from fly import main; asyncio.run(main())"
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fly_vlc.m3u8 fly_tivimate.m3u8
          git diff --staged --quiet || git commit -m "Update FLY M3U8 files [skip ci]"
          git push
