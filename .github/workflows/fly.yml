name: Fly Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp selectolax
          pip install playwright "httpx[http2]" pytz "tzdata>=2026.3" "adblock>=0.6.0"
          playwright install chromium
          
          
      - name: Run FLY updater
        env:
          FLY_API_URL: ${{ secrets.FLY_API_URL }}
          FLY_BASE_URL: ${{ secrets.FLY_BASE_URL }}
          VLC_USER_AGENT: ${{ secrets.VLC_USER_AGENT }}
          TIVIMATE_USER_AGENT: ${{ secrets.TIVIMATE_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the main script
          python -c "import asyncio; from fly import main; asyncio.run(main())"
          
      - name: Commit and push changes
        if: success()
        run: |
          set -e

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add fly_vlc.m3u8 fly_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update FLY playlist - $(date -u '+%Y-%m-%d %H:%M:%S')"

          # Keep local main synchronized with the latest remote main
          git fetch origin main
          git rebase origin/main

          # Push. Retry if another workflow updates main simultaneously.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected because remote changed."
              echo "Fetching latest main and rebasing..."

              git fetch origin main
              git rebase origin/main
            fi
          done

          echo "ERROR: Unable to push after 3 attempts."
          exit 1
