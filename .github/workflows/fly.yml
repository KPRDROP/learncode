name: Fly Updater

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp selectolax
          pip install playwright httpx[http2] pytz tzdata>=2026.3 adblock
          playwright install chromium
          
          
      - name: Run FLY updater
        env:
          FLY_API_URL: ${{ secrets.FLY_API_URL }}
          FLY_BASE_URL: ${{ secrets.FLY_BASE_URL }}
          VLC_USER_AGENT: ${{ secrets.VLC_USER_AGENT }}
          TIVIMATE_USER_AGENT: ${{ secrets.TIVIMATE_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the main script
          python -c "import asyncio; from fly import main; asyncio.run(main())"
          
      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          ggit add fly_vlc.m3u8 fly_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update FLY playlist - $(date -u '+%Y-%m-%d %H:%M:%S')"

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Push rejected. Syncing with remote..."

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
